<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrossel Contínuo Infinito</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Cabeçalho Fixo no Topo -->
    <header class="main-header">
        <button id="playPauseBtn" class="btn">▶ Play</button>
    </header>

    <!-- Container Principal do Carrossel -->
    <div class="carousel-wrapper">
        <div class="carousel-container" id="carouselContainer">
            <div class="carousel-track" id="carouselTrack">
                
                <!-- Grupo Original (15 Imagens) -->
                <div class="carousel-group" id="originalGroup">
                    <img src="imgs/1ntro.jpg" alt="Imagem 1">
                    <img src="imgs/IMG_12.jpg" alt="Imagem 12">
                    <img src="imgs/IMG_11.jpg" alt="Imagem 11">
                    <img src="imgs/IMG_10.jpg" alt="Imagem 10">
                    <img src="imgs/IMG_9.jpg" alt="Imagem 9">
                    <img src="imgs/IMG_8.jpg" alt="Imagem 8">
                    <img src="imgs/IMG_7.jpg" alt="Imagem 7">
                    <img src="imgs/IMG_6.jpg" alt="Imagem 6">
                    <img src="imgs/IMG_5.jpg" alt="Imagem 5">
                    <img src="imgs/IMG_4.jpg" alt="Imagem 4">
                    <img src="imgs/IMG_3.jpg" alt="Imagem 3">
                    <img src="imgs/IMG_2.jpg" alt="Imagem 2">
                    <img src="imgs/IMG_1.jpg" alt="Imagem 1">
                    <img src="imgs/IMG_17ending.jpeg" alt="Imagem 17">
                </div>

                <!-- O grupo duplicado será gerado automaticamente via JS -->
                
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
